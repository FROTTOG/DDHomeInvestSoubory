<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Administrace | D&amp;D HOMEINVEST</title>
  <style>
    :root {
      --navy: #0a1628;
      --navy-light: #152238;
      --brass: #c9a84c;
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.58);
      --border: rgba(255,255,255,.1);
      --danger: #f87171;
      --success: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(201,168,76,.12), transparent 25%), linear-gradient(180deg, #09111f 0%, var(--navy) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 420px);
      background: rgba(14, 24, 43, .88);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      text-align: center;
    }
    .badge {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--brass);
      background: rgba(201,168,76,.12);
      border: 1px solid rgba(201,168,76,.24);
      font-weight: 800;
      font-size: 24px;
      letter-spacing: .06em;
    }
    h1 { margin: 0; font-size: 28px; }
    .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 8px; font-size: 14px; color: rgba(255,255,255,.75); }
    input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(8, 16, 32, .85);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      outline: none;
      font-size: 15px;
    }
    input:focus {
      border-color: rgba(201,168,76,.45);
      box-shadow: 0 0 0 4px rgba(201,168,76,.1);
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease, background .15s ease;
    }
    button:active { transform: translateY(1px); }
    .primary {
      background: var(--brass);
      color: var(--navy);
    }
    .primary[disabled] { opacity: .6; cursor: wait; }
    .secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stack { display: grid; gap: 12px; }
    .message {
      display: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid transparent;
    }
    .message.error {
      display: block;
      color: #fecaca;
      background: rgba(239, 68, 68, .1);
      border-color: rgba(239,68,68,.25);
    }
    .message.success {
      display: block;
      color: #d1fae5;
      background: rgba(16, 185, 129, .1);
      border-color: rgba(16,185,129,.25);
    }
    .hint { margin-top: 16px; font-size: 12px; text-align: center; color: rgba(255,255,255,.4); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="badge">DD</div>
      <div>
        <h1>Administrace</h1>
        <p class="sub">D&amp;D HOMEINVEST s.r.o.</p>
      </div>
    </div>
    <div id="message" class="message" role="alert"></div>
    <form id="login-form">
      <label>
        Uživatelské jméno
        <input name="username" autocomplete="username" required placeholder="honza2555" />
      </label>
      <label>
        Heslo
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••••••" />
      </label>
      <div class="stack">
        <button class="primary" id="submit" type="submit">Přihlásit se</button>
        <a class="secondary" href="/">← Zpět na web</a>
      </div>
    </form>
    <p class="hint">Přihlášení je ověřováno na serveru (D1) a administrace používá D1 + R2.</p>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');

    const showMessage = (text, type) => {
      message.className = 'message ' + type;
      message.textContent = text;
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      submit.textContent = 'Přihlašuji...';
      message.className = 'message';
      message.textContent = '';

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        if (!response.ok || !data.token) {
          throw new Error(data.error || 'Přihlášení se nepodařilo.');
        }

        localStorage.setItem('dd_admin_session', data.token);
        showMessage('Přihlášení proběhlo úspěšně, přesměrovávám…', 'success');
        window.location.href = '/admin';
      } catch (error) {
        showMessage(error.message || 'Přihlášení se nepodařilo.', 'error');
        submit.disabled = false;
        submit.textContent = 'Přihlásit se';
      }
    });
  </script>
</body>
</html>
